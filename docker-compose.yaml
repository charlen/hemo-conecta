services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemo-conecta
    networks:
      - hemo-conecta-network
    ports:
      - "8050:80"
    environment:
      VITE_API_URL: http://backend:8080

  front-dev:
    image: node:20-alpine
    container_name: hemo-conecta-dev
    working_dir: /app
    networks:
      - hemo-conecta-network
    ports:
      - "5174:5173"
    environment:
      VITE_API_URL: http://backend:8080
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true

networks:
  hemo-conecta-network:
    name: hemo-conecta-network
